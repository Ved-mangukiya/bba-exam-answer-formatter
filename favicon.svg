<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Gold Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fcd34d" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.85" />

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="200" r="160" fill="#6366f1" opacity="0.18" filter="url(#softGlow)" />

  <!-- A4 Paper Sheet -->
  <g filter="url(#dropShadow)">
    <!-- Sheet Outline with Folded Corner -->
    <path d="M 128 92 
             L 320 92 
             L 384 156 
             L 384 416 
             A 12 12 0 0 1 372 428 
             L 140 428 
             A 12 12 0 0 1 128 416 
             Z" 
          fill="url(#paperGrad)" />

    <!-- Corner Fold Triangle -->
    <path d="M 320 92 L 320 156 L 384 156 Z" fill="#cbd5e1" />
    <path d="M 320 156 L 384 156 L 320 92 Z" fill="#e2e8f0" opacity="0.6" />

    <!-- Paper Header Rules (GTU Style Stripes) -->
    <rect x="156" y="128" width="136" height="8" rx="4" fill="#4338ca" />
    <rect x="156" y="146" width="96" height="5" rx="2.5" fill="#d97706" />

    <!-- Answer Sheet Content Lines -->
    <!-- Q.1 Heading Line -->
    <rect x="156" y="180" width="190" height="7" rx="3.5" fill="#1e293b" />
    <rect x="156" y="193" width="120" height="3" rx="1.5" fill="#4f46e5" /> <!-- Underline -->

    <!-- Body Paragraph Lines -->
    <rect x="156" y="214" width="200" height="5.5" rx="2.7" fill="#64748b" />
    <rect x="156" y="230" width="180" height="5.5" rx="2.7" fill="#64748b" />
    <rect x="156" y="246" width="195" height="5.5" rx="2.7" fill="#64748b" />
    <rect x="190" y="254" width="60" height="2.5" rx="1.2" fill="#e11d48" /> <!-- Keyword Underline -->

    <!-- Numbered Points -->
    <circle cx="164" cy="278" r="4.5" fill="#4338ca" />
    <rect x="178" y="275" width="170" height="5.5" rx="2.7" fill="#475569" />

    <circle cx="164" cy="298" r="4.5" fill="#4338ca" />
    <rect x="178" y="295" width="150" height="5.5" rx="2.7" fill="#475569" />

    <circle cx="164" cy="318" r="4.5" fill="#4338ca" />
    <rect x="178" y="315" width="165" height="5.5" rx="2.7" fill="#475569" />

    <!-- Distinction Table Miniature -->
    <rect x="156" y="340" width="195" height="42" rx="4" fill="none" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="156" y1="354" x2="351" y2="354" stroke="#94a3b8" stroke-width="2" />
    <line x1="253" y1="340" x2="253" y2="382" stroke="#94a3b8" stroke-width="2" />
    <rect x="164" y="345" width="60" height="4.5" rx="2" fill="#334155" />
    <rect x="261" y="345" width="60" height="4.5" rx="2" fill="#334155" />
    <rect x="164" y="364" width="70" height="4" rx="2" fill="#64748b" />
    <rect x="261" y="364" width="70" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Golden Fountain Pen (Examiner / Formatter Quill Nib) -->
  <g transform="translate(240, 160) rotate(-35)" filter="url(#dropShadow)">
    <!-- Pen Barrel Handle -->
    <path d="M 120 18 L 132 18 L 136 120 L 116 120 Z" fill="#1e1b4b" stroke="#f59e0b" stroke-width="3" />
    <!-- Gold Ring Collar -->
    <rect x="114" y="120" width="24" height="12" rx="2" fill="url(#goldGrad)" />
    <!-- Nib Body -->
    <path d="M 115 132 
             C 115 155, 106 185, 126 215 
             L 126 218 
             L 126 215 
             C 146 185, 137 155, 137 132 
             Z" 
          fill="url(#nibGrad)" 
          stroke="#78350f" 
          stroke-width="2" />
    <!-- Nib Slit & Breather Hole -->
    <line x1="126" y1="165" x2="126" y2="215" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="126" cy="165" r="4.5" fill="#451a03" />
    <!-- Metallic Nib Engraving Wings -->
    <path d="M 119 146 Q 126 154 133 146" fill="none" stroke="#b45309" stroke-width="1.8" />
  </g>

  <!-- Sparkling Nib Star Accent -->
  <g transform="translate(395, 335)" filter="url(#softGlow)">
    <path d="M 0 -16 Q 0 0 16 0 Q 0 0 0 16 Q 0 0 -16 0 Q 0 0 0 -16 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4" fill="#fef08a" />
  </g>

  <!-- Bottom Glassmorphic "BBA" Monogram Pill -->
  <g filter="url(#dropShadow)">
    <rect x="166" y="420" width="180" height="52" rx="26" fill="#090d16" fill-opacity="0.88" stroke="url(#goldGrad)" stroke-width="3.5" />
    <text x="256" y="457" 
          font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', 'Segoe UI', sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="4" 
          fill="url(#goldGrad)" 
          text-anchor="middle">BBA</text>
  </g>
</svg>
